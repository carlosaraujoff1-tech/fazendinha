# Testes + APK de depuração Android na nuvem (GameCI).
# - "core-tests" roda sempre (C# puro, sem Unity, sem segredos).
# - "unity" só roda quando os segredos UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD existem
#   (Settings > Secrets and variables > Actions). Passo a passo: Docs/build-na-nuvem.md
# - O APK fica numa Release "apk-latest" (link direto para baixar no celular).
name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  core-tests:
    name: Testes do Core (dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testes + cobertura (mínimo 80%)
        run: bash Tools/run-core-tests.sh --coverage

  unity:
    name: Testes Unity + APK
    needs: core-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publicar a Release com o APK
      checks: write     # publicar o resumo dos testes Unity
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Segredos da Unity configurados?
        id: check
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "Faltam os segredos da Unity: build pulada. Veja Docs/build-na-nuvem.md" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Liberar espaço em disco (imagem Android do Unity é grande)
        if: steps.check.outputs.ok == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.check.outputs.ok == 'true'
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      # Só EditMode na nuvem: o Editor headless às vezes trava (segfault 139) ao recarregar scripts
      # para entrar em PlayMode, antes de qualquer teste rodar. PlayMode roda no Unity local (Tools/run-tests.ps1).
      - name: Testes EditMode
        if: steps.check.outputs.ok == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados Unity

      # 1ª execução do Unity: configura o projeto (Input System, URP, cena). A troca de Input System
      # só vale depois de reiniciar o editor, por isso a build é uma 2ª execução separada.
      - name: Configurar projeto
        if: steps.check.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildMethod: Game.Editor.ProjectSetup.ApplyFromCommandLine
          buildName: setup
          allowDirtyBuild: true

      - name: Build APK
        if: steps.check.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildMethod: Game.Editor.BuildAndroid.BuildDebugApk
          buildName: FazendaMercadinho-debug
          allowDirtyBuild: true

      - name: Guardar APK como artefato
        if: steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/Android/**/*.apk
          if-no-files-found: error

      - name: Publicar APK (link para o celular)
        if: steps.check.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK de teste (último build)
          prerelease: true
          make_latest: false
          files: build/Android/**/*.apk
          body: |
            Build automática do commit ${{ github.sha }}.
            No celular: toque no arquivo .apk abaixo para baixar e instalar.

      # ---------- Prints automáticos (para o Claude ver o jogo de verdade) ----------
      - name: Limpar cache de pacotes (outra imagem do Unity)
        if: steps.check.outputs.ok == 'true'
        run: sudo rm -rf Library/PackageCache Library/Bee Library/ScriptAssemblies Library/PackageManager || true

      - name: Build Linux para prints
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: Game.Editor.BuildScreenshots.BuildLinux
          buildName: fazenda
          allowDirtyBuild: true

      - name: Rodar o jogo e capturar telas (xvfb, render por software)
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa > /dev/null
          sudo chmod -R a+rwX build || true
          EXE=$(find build/StandaloneLinux64 -name "*.x86_64" | head -1)
          echo "Executável: $EXE"
          mkdir -p screenshots
          timeout 420 xvfb-run -a -s "-screen 0 1920x1080x24" "$EXE" -screen-width 1920 -screen-height 1080 \
            -screen-fullscreen 0 -force-glcore -logFile "$PWD/screenshots/player.log" \
            -fazendaScreenshots "$PWD/screenshots" || echo "jogo saiu com código $?"
          ls -la screenshots

      - name: Publicar prints
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screenshots-latest
          name: Prints automáticos (último build)
          prerelease: true
          make_latest: false
          files: |
            screenshots/*.png
            screenshots/player.log
          body: Capturas automáticas do commit ${{ github.sha }} (jogo rodando em Linux com render por software).
